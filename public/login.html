
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Student Management System</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.10);
    }

    .logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 10px 0 26px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #dc2626;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">S</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Student Management System</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Sign In</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>

    <div class="footer">Authorized administrators only</div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.style.color = "#dc2626";
      message.textContent = "Signing in...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent = data.message || "Login failed.";
          return;
        }

        message.style.color = "#15803d";
        message.textContent = "Login successful. Opening dashboard...";
        window.location.assign("/");
      } catch (error) {
        message.textContent =
          "Cannot connect to the server. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
